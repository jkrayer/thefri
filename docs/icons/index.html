    <style>
      .icon {
        width: 1rem;
        height: 1rem;
        display: inline-block;
        fill: var(--neutral20);

        --primary: #0085bf;
        --secondary: #ff8a3d;
        --tertiary: #6a4ccf;
        --muted: var(--neutral90);
        --danger: #dc3545;
        --success: #28a745;
        --warning: #ffc107;
        --info: #17a2b8;

        &.x-small {
          width: 0.75rem;
          height: 0.75rem;
        }
        &.small {
          width: 1.25rem;
          height: 1.25rem;
        }
        &.medium {
          width: 1.5rem;
          height: 1.5rem;
        }
        &.large {
          width: 2rem;
          height: 2rem;
        }
        &.x-large {
          width: 3rem;
          height: 3rem;
        }
        &.primary {
          fill: var(--primary);
        }
        &.secondary {
          fill: var(--secondary);
        }
        &.tertiary {
          fill: var(--tertiary);
        }
        &.muted {
          fill: var(--muted);
        }
        &.danger {
          fill: var(--danger);
        }
        &.success {
          fill: var(--success);
        }
        &.warning {
          fill: var(--warning);
        }
        &.info {
          fill: var(--info);
        }

        &.animate-spin {
          animation: spin 1.5s linear infinite;
        }
      }
    </style>
  </head>
